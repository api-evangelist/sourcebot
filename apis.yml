aid: sourcebot
name: Sourcebot
description: >-
  Sourcebot is a self-hosted code understanding platform built by Taqla Inc. that helps
  developers and AI agents search, navigate, and understand large enterprise codebases. It
  indexes every repository across GitHub, GitLab, Bitbucket, Azure DevOps, Gerrit, and Gitea
  and runs entirely inside your own infrastructure, so source code never leaves your deployment.
  Alongside a fast regex- and symbol-aware code search UI with file explorer and git history/blame,
  Sourcebot ships "Ask Sourcebot" natural-language codebase Q&A and an agent code context layer
  (an MCP server) that gives coding agents like Cursor and Claude Code grounded context across
  every repo. Its public REST API exposes search, symbol navigation, repository listing, git
  history/blame/diff, and enterprise user/audit endpoints, secured with API keys (and EE OAuth
  for agent clients). Free self-hosted Basic tier, paid Pro tier for AI and enterprise security.
