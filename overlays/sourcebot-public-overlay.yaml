overlay: 1.0.0
info:
  title: API Evangelist enhancements for Sourcebot Public API
  version: 1.0.0
extends: openapi/sourcebot-public-openapi-original.json
actions:
  - target: $.info
    update:
      x-apievangelist-provider: sourcebot
      x-apievangelist-company: Taqla Inc.
      x-apievangelist-self-hosted: true
      x-apievangelist-notes: >-
        Self-hosted code understanding platform. Base URL is instance-dependent; the hosted
        public demo is https://app.sourcebot.dev. Auth is API key (Bearer or X-Sourcebot-Api-Key);
        EE endpoints require a license and OWNER role. MCP server available at /api/mcp.
  - target: $.servers
    update:
      - url: https://app.sourcebot.dev
        description: Hosted public demo instance (self-hosted deployments use your own host).
  - target: $.info
    update:
      x-apievangelist-artifacts:
        authentication: authentication/sourcebot-authentication.yml
        conventions: conventions/sourcebot-conventions.yml
        errors: errors/sourcebot-problem-types.yml
        data_model: data-model/sourcebot-data-model.yml
        mcp: mcp/sourcebot-mcp.yml
        changelog: changelog/sourcebot-changelog.yml
        lifecycle: lifecycle/sourcebot-lifecycle.yml
